# @lp181818/dsh-vision-plugin bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer over dsh-base.
#
# The row is a bare plugin by package name: the node half (exports ".") registers
# the vision-plugin settings namespace, and the dsh.client declaration in
# package.json makes the browser half load in the web GUI.
- insert:
    - id: vision-plugin
      name: '@lp181818/dsh-vision-plugin'
